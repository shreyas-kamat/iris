version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # These releases need Dart 3.12, newer than the Flutter that CI pins.
    # Drop these rules when FLUTTER_VERSION moves past 3.41.
    ignore:
      - dependency-name: freezed
        versions: [">=4.0.0-0"]
      - dependency-name: cupertino_icons
        versions: [">=2.0.0-0"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
