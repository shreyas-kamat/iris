[project]
name = "hermes-iris"
version = "0.2.0"
description = "Hermes plugin for the Iris app: validated OpenUI Lang displays, reply kits and a per-profile store."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
